name: talkeando

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: talkeando
      POSTGRES_PASSWORD: talkeando
      POSTGRES_DB: talkeando
    ports:
      # Host port 5434, not the default 5432 — chosen so this doesn't
      # collide with a Postgres someone already has running locally for a
      # different project (a real conflict found on the dev machine this
      # was written on). Keep this in sync with server/.env(.example)'s
      # DATABASE_URL if you change it.
      - "5434:5432"
    volumes:
      - talkeando_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talkeando"]
      interval: 5s
      timeout: 3s
      retries: 10

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]

  livekit:
    image: livekit/livekit-server:v1.9.12
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50200:50000-50200/udp"
    volumes:
      - ./livekit/livekit.dev.yaml:/etc/livekit.yaml:ro

volumes:
  talkeando_pg_data:
