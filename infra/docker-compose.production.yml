name: talkeando

services:
  tupi-server:
    build:
      context: ../server
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set the Neon production connection string}
      BIND_ADDR: 0.0.0.0:8080
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:?set in production env}
      MUSIC_BOT_TOKEN: ${MUSIC_BOT_TOKEN:-}
      TURN_REALM: ${TURN_REALM:?set in production env}
      TURN_URIS: ${TURN_URIS:?set in production env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set in production env}
      ATTACHMENT_STORAGE_PATH: /var/lib/tupi/attachments
    volumes:
      - attachments_data:/var/lib/tupi/attachments

  # Generates a real Proof-of-Origin token for yt-dlp so YouTube's bot check
  # passes from this VPS's datacenter IP. Without it, YouTube keeps
  # invalidating even freshly-exported account cookies within hours
  # ("Sign in to confirm you're not a bot" despite valid cookies) — cookies
  # alone stopped being enough. No host port needed; music-bot reaches it by
  # service name over the compose network.
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped

  music-bot:
    build:
      context: ../music-bot
    restart: unless-stopped
    depends_on:
      - tupi-server
      - bgutil-provider
    env_file:
      - ./music-bot.env
    environment:
      TUPI_WS_URL: ws://tupi-server:8080/ws
      # Falls back to TURN_SHARED_SECRET in the bot for existing deployments;
      # set MUSIC_BOT_TOKEN in .env later to rotate it independently.
      MUSIC_BOT_TOKEN: ${MUSIC_BOT_TOKEN:-}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:?set in production env}
      TURN_URIS: ${TURN_URIS:?set in production env}
      PROVIDER_CHAIN: ${PROVIDER_CHAIN:-cache,library,soundcloud,audius,youtube}
      YT_POT_PROVIDER_URL: http://bgutil-provider:4416
    volumes:
      # Drop a Netscape cookies.txt exported from a logged-in YouTube session
      # at ./cookies/yt.txt on the host — required, YouTube blocks this IP
      # without it. `mkdir -p infra/cookies` so the mount source always exists.
      - ./cookies:/cookies:ro
      # Persist yt-dlp's cache (the fetched EJS challenge-solver script and
      # player JS) so a redeploy doesn't re-download it on the first /play.
      - ytdlp_cache:/home/node/.cache/yt-dlp

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - tupi-server
    environment:
      API_DOMAIN: ${API_DOMAIN:?set in production env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  coturn:
    image: coturn/coturn:4.7-alpine
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --listening-port=3478
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET:?set in production env}
      - --realm=${TURN_REALM:?set in production env}
      - --no-multicast-peers
      - --no-cli
      - --no-tls
      - --no-dtls
      - --min-port=49160
      - --max-port=49200
      - --external-ip=${TURN_EXTERNAL_IP:?set the Lightsail static public IP}/${TURN_PRIVATE_IP:?set the Lightsail private IP}

volumes:
  attachments_data:
  caddy_data:
  caddy_config:
  ytdlp_cache:
