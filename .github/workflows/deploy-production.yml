name: Deploy production

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'infra/**'
      - 'music-bot/**'
      - '.github/workflows/deploy-production.yml'
  workflow_dispatch:

# A second push waits instead of overlapping a Docker build on the 2 GB VPS.
concurrency:
  group: talkeando-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Test server and music bot
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: talkeando
          POSTGRES_PASSWORD: talkeando
          POSTGRES_DB: postgres
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U talkeando -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install music bot dependencies
        working-directory: music-bot
        run: npm ci

      - name: Test music bot
        working-directory: music-bot
        run: npm test

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Test server
        working-directory: server
        env:
          TEST_DATABASE_ADMIN_URL: postgres://talkeando:talkeando@localhost:5434/postgres
        run: cargo test --locked

  provider-integration:
    name: Verify real music providers
    runs-on: ubuntu-latest
    environment: production
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - name: Validate integration secrets
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          test -n "$SPOTIFY_CLIENT_ID" || { echo "Missing SPOTIFY_CLIENT_ID"; exit 1; }
          test -n "$SPOTIFY_CLIENT_SECRET" || { echo "Missing SPOTIFY_CLIENT_SECRET"; exit 1; }
          test -n "$YOUTUBE_API_KEY" || { echo "Missing YOUTUBE_API_KEY"; exit 1; }

      - name: Build bot integration image
        run: docker build --tag tupi-music-provider-smoke ./music-bot

      # Discovery-only: Spotify + YouTube Data API resolve metadata; SoundCloud
      # and Audius stream the audio. No cookies, no Proof-of-Origin sidecar, no
      # datacenter-IP bot check — every request here works from the Actions IP.
      - name: Exercise real providers (Spotify + YouTube API, SoundCloud + Audius audio)
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          AUDIUS_API_KEY: ${{ secrets.AUDIUS_API_KEY }}
        run: |
          docker run --rm \
            --env SPOTIFY_CLIENT_ID \
            --env SPOTIFY_CLIENT_SECRET \
            --env YOUTUBE_API_KEY \
            --env AUDIUS_API_KEY \
          tupi-music-provider-smoke node scripts/provider-integration-smoke.js

  build-images:
    name: Build production images
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      server_image: ${{ steps.images.outputs.server_image }}
      music_bot_image: ${{ steps.images.outputs.music_bot_image }}

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: ghcr.io/mrvitor0/tupi-server:${{ github.sha }}
          cache-from: type=gha,scope=tupi-server
          cache-to: type=gha,mode=max,scope=tupi-server
      - name: Build and publish music bot image
        uses: docker/build-push-action@v6
        with:
          context: ./music-bot
          push: true
          tags: ghcr.io/mrvitor0/tupi-music-bot:${{ github.sha }}
          cache-from: type=gha,scope=tupi-music-bot
          cache-to: type=gha,mode=max,scope=tupi-music-bot
      - id: images
        name: Export immutable image references
        run: |
          echo "server_image=ghcr.io/mrvitor0/tupi-server:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "music_bot_image=ghcr.io/mrvitor0/tupi-music-bot:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Lightsail São Paulo
    runs-on: ubuntu-latest
    needs: [provider-integration, build-images]
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure restricted SSH access
        env:
          DEPLOY_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          DEPLOY_KEY_B64: ${{ secrets.LIGHTSAIL_SSH_KEY_B64 }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_KEY_B64"
          install -d -m 700 ~/.ssh
          printf '%s' "$DEPLOY_KEY_B64" | base64 --decode > ~/.ssh/talkeando-production
          chmod 600 ~/.ssh/talkeando-production
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      # Provider credentials live in a file read only by the music-bot
      # container. Values are streamed over SSH and never written to the
      # Actions workspace or passed as command-line arguments on the VPS.
      - name: Deploy music-bot provider credentials
        env:
          DEPLOY_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          AUDIUS_API_KEY: ${{ secrets.AUDIUS_API_KEY }}
        run: |
          test -n "$SPOTIFY_CLIENT_ID" || { echo "Missing production secret: SPOTIFY_CLIENT_ID"; exit 1; }
          test -n "$SPOTIFY_CLIENT_SECRET" || { echo "Missing production secret: SPOTIFY_CLIENT_SECRET"; exit 1; }
          test -n "$YOUTUBE_API_KEY" || { echo "Missing production secret: YOUTUBE_API_KEY"; exit 1; }
          {
            printf 'SPOTIFY_CLIENT_ID=%s\n' "$SPOTIFY_CLIENT_ID"
            printf 'SPOTIFY_CLIENT_SECRET=%s\n' "$SPOTIFY_CLIENT_SECRET"
            printf 'YOUTUBE_API_KEY=%s\n' "$YOUTUBE_API_KEY"
            printf 'AUDIUS_API_KEY=%s\n' "$AUDIUS_API_KEY"
          } | ssh -i ~/.ssh/talkeando-production "ubuntu@$DEPLOY_HOST" '
              set -eu
              install -d -m 755 /opt/talkeando/infra
              umask 077
              cat > /opt/talkeando/infra/music-bot.env.new
              grep -q "^SPOTIFY_CLIENT_ID=." /opt/talkeando/infra/music-bot.env.new
              grep -q "^SPOTIFY_CLIENT_SECRET=." /opt/talkeando/infra/music-bot.env.new
              grep -q "^YOUTUBE_API_KEY=." /opt/talkeando/infra/music-bot.env.new
              mv /opt/talkeando/infra/music-bot.env.new /opt/talkeando/infra/music-bot.env
              echo "music-bot provider credentials deployed"
            '

      - name: Upload and apply release
        env:
          DEPLOY_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          API_DOMAIN: ${{ secrets.API_DOMAIN }}
          SFU_DOMAIN: ${{ secrets.SFU_DOMAIN }}
          TUPI_SERVER_IMAGE: ${{ needs.build-images.outputs.server_image }}
          MUSIC_BOT_IMAGE: ${{ needs.build-images.outputs.music_bot_image }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          test -n "$LIVEKIT_API_KEY" && test -n "$LIVEKIT_API_SECRET" && test -n "$LIVEKIT_URL" && test -n "$SFU_DOMAIN" && test -n "$TUPI_SERVER_IMAGE" && test -n "$MUSIC_BOT_IMAGE"
          export LIVEKIT_API_KEY LIVEKIT_API_SECRET API_DOMAIN
          envsubst < infra/livekit/livekit.yaml.tmpl | ssh -i ~/.ssh/talkeando-production "ubuntu@$DEPLOY_HOST" 'set -eu; install -d -m 755 /opt/talkeando/infra/livekit; umask 077; cat > /opt/talkeando/infra/livekit/livekit.yaml'
          {
            printf 'LIVEKIT_URL=%s\n' "$LIVEKIT_URL"
            printf 'LIVEKIT_API_KEY=%s\n' "$LIVEKIT_API_KEY"
            printf 'LIVEKIT_API_SECRET=%s\n' "$LIVEKIT_API_SECRET"
            printf 'API_DOMAIN=%s\n' "$API_DOMAIN"
            printf 'SFU_DOMAIN=%s\n' "$SFU_DOMAIN"
            printf 'TUPI_SERVER_IMAGE=%s\n' "$TUPI_SERVER_IMAGE"
            printf 'MUSIC_BOT_IMAGE=%s\n' "$MUSIC_BOT_IMAGE"
          } | ssh -i ~/.ssh/talkeando-production "ubuntu@$DEPLOY_HOST" 'set -eu; umask 077; cat > /opt/talkeando/infra/livekit.env'
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/talkeando-production "ubuntu@$DEPLOY_HOST" "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"
          tar -czf - \
            --exclude='infra/.env' \
            infra/Caddyfile \
            infra/livekit \
            infra/docker-compose.production.yml \
          | ssh -i ~/.ssh/talkeando-production "ubuntu@$DEPLOY_HOST" '
              set -eu
              tar -xzf - -C /opt/talkeando
              cd /opt/talkeando/infra
              set -a
              . ./livekit.env
              set +a
              docker compose -f docker-compose.production.yml pull tupi-server music-bot
              docker compose -f docker-compose.production.yml up -d --no-build --remove-orphans
              # `up` does not recreate caddy when only the bind-mounted Caddyfile
              # changed (compose hashes the service def, not the file contents),
              # and caddy reads its config once at process start — so an
              # upstream/host rename in the Caddyfile is otherwise ignored until
              # something restarts the container. `caddy reload` proved
              # unreliable over `compose exec` (exits 0 without applying), so just
              # recreate it — a ~1s restart on this box.
              docker compose -f docker-compose.production.yml up -d --force-recreate caddy
              docker compose -f docker-compose.production.yml ps
              docker logout ghcr.io
            '
