name: Deploy production

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'infra/**'
      - 'music-bot/**'
      - '.github/workflows/deploy-production.yml'
  workflow_dispatch:

# A second push waits instead of overlapping a Docker build on the 2 GB VPS.
concurrency:
  group: talkeando-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Lightsail São Paulo
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure restricted SSH access
        env:
          DEPLOY_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          DEPLOY_KEY_B64: ${{ secrets.LIGHTSAIL_SSH_KEY_B64 }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_KEY_B64"
          install -d -m 700 ~/.ssh
          printf '%s' "$DEPLOY_KEY_B64" | base64 --decode > ~/.ssh/talkeando-production
          chmod 600 ~/.ssh/talkeando-production
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      # YouTube blocks this datacenter IP outright — the music bot only works
      # with cookies from a (throwaway) logged-in account. Store the Netscape
      # cookies.txt as base64 in the YT_DLP_COOKIES_B64 secret; it is written
      # to the host at the path the compose `./cookies:/cookies:ro` mount
      # expects. Refresh it any time by updating the secret and re-running the
      # workflow (workflow_dispatch). Absent secret => step is a no-op.
      - name: Deploy music-bot YouTube cookies
        env:
          DEPLOY_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          YT_DLP_COOKIES_B64: ${{ secrets.YT_DLP_COOKIES_B64 }}
        run: |
          if [ -z "${YT_DLP_COOKIES_B64:-}" ]; then
            echo "YT_DLP_COOKIES_B64 not set — skipping (music bot will fail on YouTube)."
            exit 0
          fi
          printf '%s' "$YT_DLP_COOKIES_B64" | base64 --decode \
          | ssh -i ~/.ssh/talkeando-production "ubuntu@$DEPLOY_HOST" '
              set -eu
              mkdir -p /opt/talkeando/infra/cookies
              umask 077
              cat > /opt/talkeando/infra/cookies/yt.txt.new
              head -c 8192 /opt/talkeando/infra/cookies/yt.txt.new | grep -qiE "cookie|youtube\.com" \
                || { echo "decoded content does not look like a cookies.txt — aborting"; rm -f /opt/talkeando/infra/cookies/yt.txt.new; exit 1; }
              mv /opt/talkeando/infra/cookies/yt.txt.new /opt/talkeando/infra/cookies/yt.txt
              echo "cookies deployed: $(wc -l < /opt/talkeando/infra/cookies/yt.txt) lines"
            '

      - name: Upload and apply release
        env:
          DEPLOY_HOST: ${{ secrets.LIGHTSAIL_HOST }}
        run: |
          tar -czf - \
            --exclude='server/target' \
            --exclude='infra/.env' \
            server \
            music-bot \
            infra/Caddyfile \
            infra/docker-compose.production.yml \
          | ssh -i ~/.ssh/talkeando-production "ubuntu@$DEPLOY_HOST" '
              set -eu
              tar -xzf - -C /opt/talkeando
              cd /opt/talkeando/infra
              docker compose -f docker-compose.production.yml up -d --build --remove-orphans
              # `up` does not recreate caddy when only the bind-mounted Caddyfile
              # changed (compose hashes the service def, not the file contents),
              # and caddy reads its config once at process start — so an
              # upstream/host rename in the Caddyfile is otherwise ignored until
              # something restarts the container. `caddy reload` proved
              # unreliable over `compose exec` (exits 0 without applying), so just
              # recreate it — a ~1s restart on this box.
              docker compose -f docker-compose.production.yml up -d --force-recreate caddy
              docker compose -f docker-compose.production.yml ps
            '
