name: Build Windows client

on:
  workflow_dispatch:
    inputs:
      version_label:
        description: 'Rótulo opcional do artefato (ex.: beta-1)'
        required: false
        default: beta

permissions:
  contents: write

jobs:
  build:
    name: Tupi Windows x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/ui/package-lock.json

      - name: Build web interface
        working-directory: client/ui
        run: |
          npm ci
          npm run build

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Test native client
        run: dotnet test client/native/Talkeando.Client.Tests/Talkeando.Client.Tests.csproj --configuration Release

      - name: Publish self-contained executable
        run: >
          dotnet publish client/native/Talkeando.Client/Talkeando.Client.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version="0.1.${{ github.run_number }}"
          -p:AssemblyVersion="0.1.${{ github.run_number }}.0"
          -p:FileVersion="0.1.${{ github.run_number }}.0"
          --output release/Tupi-win-x64

      - name: Write release notes
        shell: pwsh
        run: |
          @"
          Talkeando — ${{ inputs.version_label }} (Build #${{ github.run_number }})

          Extraia todo o ZIP e execute Tupi.exe.
          Esta build usa a API de produção configurada em tupi.settings.json.
          "@ | Set-Content -NoNewline release/Tupi-win-x64/LEIA-ME.txt

      - name: Zip build files
        shell: pwsh
        run: |
          Compress-Archive -Path release/Tupi-win-x64/* -DestinationPath "release/Tupi-${{ inputs.version_label }}-win-x64.zip"

      - name: Download WebView2 Bootstrapper
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "client/native/installer/MicrosoftEdgeWebview2Setup.exe"

      - name: Build Installer (Inno Setup)
        shell: pwsh
        run: |
          iscc /DAppVersion="${{ inputs.version_label }}" /DPublishDir="${{ github.workspace }}\release\Tupi-win-x64" client/native/installer/Tupi.iss

      - uses: actions/upload-artifact@v4
        with:
          name: Tupi-${{ inputs.version_label }}-win-x64
          path: |
            release/Tupi-win-x64
            release/Tupi-${{ inputs.version_label }}-win-x64.zip
            client/native/installer/output/Tupi-Setup-${{ inputs.version_label }}-x64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # The updater compares semantic versions. Keep the channel label in
          # the title/file name, but use one unambiguous numeric tag so a
          # client can jump straight to the newest release.
          $tag = "v0.1.${{ github.run_number }}"
          gh release create $tag "release/Tupi-${{ inputs.version_label }}-win-x64.zip" "client/native/installer/output/Tupi-Setup-${{ inputs.version_label }}-x64.exe" --title "Tupi Client v${{ inputs.version_label }} (Build #${{ github.run_number }})" --notes "Manual release build from main branch."
